[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-services-agent"
version = "0.1.0"
description = "Source-backed MEP workflows from requirements to drawings and analysis"
requires-python = ">=3.11"
dependencies = ["ezdxf==1.4.5"]

[project.optional-dependencies]
codex-setup = ["tomlkit==0.15.1"]
autocad-source = ["pydantic==2.14.3", "numpy==2.5.4"]
mcp = ["mcp==1.30.0", "pypdf==7.0.0", "Pillow==13.0.0"]
vendor-bim = ["olefile==0.47"]
modules = ["jsonschema==4.26.0"]
demand = ["scipy==1.18.1", "numpy==2.5.4"]
dev = ["PyYAML==6.0.3", "pypdf==7.0.0"]
documents = ["pypdf==7.0.0"]
reports = ["reportlab==4.4.9", "pypdf==7.0.0", "Pillow==13.0.0", "charset-normalizer==3.5.2"]
ocr = ["pypdf==7.0.0", "rapidocr_onnxruntime==1.4.4", "onnxruntime==1.31.1", "opencv-python==5.0.0.93"]
energy = ["openstudio==3.11.0"]
bim = ["ifcopenshell==0.8.5", "pytest==9.2.0"]
clash = ["ifcopenshell==0.8.5", "pytest==9.2.0", "manifold3d==3.5.4"]
network = ["fluids==1.3.1"]
tee = ["ifcopenshell==0.8.5", "manifold3d==3.5.4", "fluids==1.3.1", "scipy==1.18.1", "numpy==2.5.4"]
water = ["wntr==1.5.0"]
ids = ["ifctester==0.8.5", "ifcopenshell==0.8.5"]
preview = ["ifcopenshell==0.8.5", "matplotlib==3.11.2", "numpy==2.5.4"]
gis = ["shapely==2.2.0", "matplotlib==3.11.2", "numpy==2.5.4"]
section = ["trimesh==5.2.0", "shapely==2.2.0", "ifcopenshell==0.8.5", "numpy==2.5.4", "pypdf==7.0.0"]

[project.scripts]
bsa = "bsa.cli:main"
bsa-mcp = "bsa.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
