name: checks
on: [push, pull_request]
jobs:
  electrical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: bsa run examples/office-electrical/project.json --out runs/office
      - run: python -m bsa.workflow validate examples/workflow-plan.json
  ifc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,bim]"
      - run: python -m unittest discover -s tests -p test_bim.py -v
      - run: python -m unittest discover -s tests -p test_coordination.py -v
      - run: python -m bsa.workflow execute examples/mep-ifc/plan.json --out runs/ifc
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,network,bim]"
      - run: python -m unittest discover -s tests -p test_network.py -v
      - run: python -m unittest discover -s tests -p test_network_binding.py -v
      - run: python -m bsa.workflow execute examples/network/plan.json --out runs/network
      - run: python -m bsa.workflow execute examples/network-binding/plan.json --out runs/network-binding
  lighting:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,bim]"
      - run: python scripts/setup_radiance.py
      - run: python -m unittest discover -s tests -p test_lighting.py -v
        env:
          BSA_TEST_RADIANCE_BIN: ${{ github.workspace }}/tools/radiance-6/bin
      - run: python -m unittest discover -s tests -p test_lighting_binding.py -v
        env:
          BSA_TEST_RADIANCE_BIN: ${{ github.workspace }}/tools/radiance-6/bin
      - run: python -m bsa.workflow execute examples/lighting/plan.json --out runs/lighting --radiance-bin tools/radiance-6/bin
      - run: python -m bsa.lighting_binding examples/office-electrical/project.json --geometry examples/office-electrical/geometry.json --optical examples/shared-lighting.json --out runs/bound-lighting --radiance-bin tools/radiance-6/bin
