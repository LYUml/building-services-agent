name: checks
on: [push, pull_request]
jobs:
  electrical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: bsa run examples/office-electrical/project.json --out runs/office
      - run: python -m bsa.workflow validate examples/workflow-plan.json
