name: checks
on: [push, pull_request]
jobs:
  energy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: tools/downloads/energyplus.zip
          key: energyplus-25.2.0-cf7368216c-windows-x64
      - run: python -m venv .venv
      - run: .venv/Scripts/python -m pip install -e ".[dev,energy,bim]"
      - run: .venv/Scripts/python scripts/setup_energy.py
      - run: .venv/Scripts/python -m unittest discover -s tests -p test_energy.py -v
        env:
          BSA_TEST_ENERGYPLUS: ${{ github.workspace }}/tools/energyplus-25.2/EnergyPlus-25.2.0-cf7368216c-Windows-x86_64/energyplus.exe
      - run: .venv/Scripts/python -m unittest discover -s tests -p test_energy_completion.py -v
        env:
          BSA_TEST_ENERGYPLUS: ${{ github.workspace }}/tools/energyplus-25.2/EnergyPlus-25.2.0-cf7368216c-Windows-x86_64/energyplus.exe
      - run: .venv/Scripts/python -m unittest discover -s tests -p test_thermal_geometry.py -v
        env:
          BSA_TEST_ENERGYPLUS: ${{ github.workspace }}/tools/energyplus-25.2/EnergyPlus-25.2.0-cf7368216c-Windows-x86_64/energyplus.exe
      - run: .venv/Scripts/python -m unittest discover -s tests -p test_thermal_materials.py -v
        env:
          BSA_TEST_ENERGYPLUS: ${{ github.workspace }}/tools/energyplus-25.2/EnergyPlus-25.2.0-cf7368216c-Windows-x86_64/energyplus.exe
      - run: .venv/Scripts/python -m unittest discover -s tests -p test_thermal_binding.py -v
        env:
          BSA_TEST_ENERGYPLUS: ${{ github.workspace }}/tools/energyplus-25.2/EnergyPlus-25.2.0-cf7368216c-Windows-x86_64/energyplus.exe
      - run: .venv/Scripts/python -m unittest discover -s tests -p test_annual_energy.py -v
        env:
          BSA_TEST_ENERGYPLUS: ${{ github.workspace }}/tools/energyplus-25.2/EnergyPlus-25.2.0-cf7368216c-Windows-x86_64/energyplus.exe
      - run: .venv/Scripts/python -m bsa.workflow execute examples/annual-energy/plan.json --out runs/annual --energyplus tools/energyplus-25.2/EnergyPlus-25.2.0-cf7368216c-Windows-x86_64/energyplus.exe
      - run: .venv/Scripts/python -m bsa.workflow verify runs/annual
  water:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,water,bim]"
      - run: python -m unittest discover -s tests -p test_epanet.py -v
      - run: python -m unittest discover -s tests -p test_water_binding.py -v
      - run: python -m bsa.workflow execute examples/water-loop/plan.json --out runs/water-loop
      - run: python -m bsa.workflow verify runs/water-loop
      - run: python -m bsa.workflow execute examples/water-loop-ifc/plan.json --out runs/water-loop-ifc
      - run: python -m bsa.workflow verify runs/water-loop-ifc
  electrical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: bsa run examples/office-electrical/project.json --out runs/office
      - run: python -m bsa.workflow validate examples/workflow-plan.json
      - run: python -m bsa.workflow validate examples/delivery-plan.json
      - run: python -m bsa.workflow execute examples/fault-plan.json --out runs/faults
      - run: python -m bsa.workflow execute examples/drawing-intake/plan.json --out runs/drawing-intake
      - run: python -m bsa.workflow execute examples/base-overlay/portable-plan.json --out runs/base-overlay
  ifc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,bim,clash]"
      - run: python -m unittest discover -s tests -p test_bim.py -v
      - run: python -m unittest discover -s tests -p test_circular_geometry.py -v
      - run: python -m unittest discover -s tests -p test_ifc_drawing.py -v
      - run: python -m unittest discover -s tests -p test_ifc_views.py -v
      - run: python -m unittest discover -s tests -p test_ifc_native.py -v
      - run: python -m unittest discover -s tests -p test_clash.py -v
      - run: python -m unittest discover -s tests -p test_contact_clearance.py -v
      - run: python -m unittest discover -s tests -p test_coordination.py -v
      - run: python -m bsa.workflow execute examples/mep-ifc/plan.json --out runs/ifc
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,network,bim,clash]"
      - run: python -m unittest discover -s tests -p test_network.py -v
      - run: python -m unittest discover -s tests -p test_network_binding.py -v
      - run: python -m unittest discover -s tests -p test_network_design.py -v
      - run: python -m unittest discover -s tests -p test_pump.py -v
      - run: python -m unittest discover -s tests -p test_pump_electrical.py -v
      - run: python -m unittest discover -s tests -p test_network_model_design.py -v
      - run: python -m unittest discover -s tests -p test_water_riser.py -v
      - run: python -m unittest discover -s tests -p test_circular_geometry.py -v
      - run: python -m bsa.workflow execute examples/network/plan.json --out runs/network
      - run: python -m bsa.workflow execute examples/network-binding/plan.json --out runs/network-binding
      - run: python -m bsa.workflow execute examples/network-design/plan.json --out runs/network-design
      - run: python -m bsa.workflow execute examples/network-model-design/plan.json --out runs/network-model-design
      - run: python -m bsa.workflow execute examples/circular-network/plan.json --out runs/circular-network
      - run: python -m bsa.workflow execute examples/clash-plan.json --out runs/ifc-clash
      - run: python -m bsa.workflow execute examples/clash-local-plan.json --out runs/ifc-clash-local
      - run: python -m bsa.workflow execute examples/water-riser/plan.json --out runs/water-riser
      - run: python -m bsa.workflow execute examples/water-riser/delivery-plan.json --out runs/water-delivery
      - run: python -m bsa.workflow execute examples/water-riser/pump-plan.json --out runs/water-pump
      - run: python -m bsa.workflow execute examples/water-riser/coupled-plan.json --out runs/water-coupled
  lighting:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,bim]"
      - run: python scripts/setup_radiance.py
      - run: python -m unittest discover -s tests -p test_lighting.py -v
        env:
          BSA_TEST_RADIANCE_BIN: ${{ github.workspace }}/tools/radiance-6/bin
      - run: python -m unittest discover -s tests -p test_lighting_binding.py -v
        env:
          BSA_TEST_RADIANCE_BIN: ${{ github.workspace }}/tools/radiance-6/bin
      - run: python -m bsa.workflow execute examples/lighting/plan.json --out runs/lighting --radiance-bin tools/radiance-6/bin
      - run: python -m bsa.lighting_binding examples/office-electrical/project.json --geometry examples/office-electrical/geometry.json --optical examples/shared-lighting.json --out runs/bound-lighting --radiance-bin tools/radiance-6/bin
