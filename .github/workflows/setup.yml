name: prerelease setup
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/bootstrap.py
      - name: Check rerun and configuration protections
        shell: bash
        run: |
          P=.bsa/venv/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then P=.bsa/venv/Scripts/python.exe; fi
          "$P" -m unittest tests.test_bootstrap tests.test_codex_setup tests.test_project_skills -v
          python scripts/bootstrap.py
      - name: Check offline Revit contracts
        shell: bash
        run: |
          P=.bsa/venv/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then P=.bsa/venv/Scripts/python.exe; fi
          "$P" -m unittest tests.test_revit_file_metadata tests.test_revit_request tests.test_revit_connectivity tests.test_revit_automation_bundle tests.test_revit_revision -v
      - name: Verify external project skills and MCP together
        run: python -c "from pathlib import Path; import subprocess,sys; p=Path('runs/external project').resolve(); p.mkdir(); subprocess.run([sys.executable,'scripts/bootstrap.py','--project-root',str(p)],check=True); assert len(list((p/'.agents/skills').glob('*/SKILL.md')))==11"
      - name: Install the extracted source candidate and exercise CLI and MCP
        if: matrix.os == 'windows-latest' && github.event_name == 'push' && github.repository == 'LYUml/building-services-agent'
        shell: pwsh
        run: |
          python scripts/build_candidate.py --out runs/install-candidate
          python -m zipfile -e runs/install-candidate/building-services-agent-source.zip runs/extracted-candidate
          Set-Location runs/extracted-candidate
          .\Setup.cmd --profile cad
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.bsa\venv\Scripts\python.exe -m unittest tests.test_air_terminal_drawing tests.test_revit_revision -v
