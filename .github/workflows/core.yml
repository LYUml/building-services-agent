name: core profiles

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[drawing,mcp,codex-setup]"
      - run: python -m bsa.codex_setup
      - run: bsa doctor --extra drawing --extra mcp --mcp-config .codex/config.toml
      - run: python -m pip check
      - run: >-
          python -m unittest
          tests.test_engine tests.test_doctor tests.test_codex_setup
          tests.test_worker_transport tests.test_mcp_response_channel
          tests.test_mcp_startup tests.test_missing_dependency_errors
          tests.test_workspace_write_guards tests.test_project_workspace
          tests.test_review_cli tests.test_recovery_imports tests.test_catalogue_iteration
          tests.test_runtime_logs tests.test_check_runner -v

  pump-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[drawing,mcp,codex-setup,network]"
      - run: python -m bsa.codex_setup
      - run: python -c "import importlib.util; assert importlib.util.find_spec('ifcopenshell') is None; assert importlib.util.find_spec('manifold3d') is None"
      - run: python -m unittest tests.test_pump_recovery_example tests.test_mcp_pump_profile tests.test_recovery_imports -v

  mcp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -e ".[drawing,mcp,codex-setup,bim,network,clash]"
      - run: python -m bsa.codex_setup --pdftoppm "$(command -v pdftoppm)"
      - run: pdftoppm -v
      - run: python -m pip check
      - run: python -m unittest tests.test_mcp_server -v
