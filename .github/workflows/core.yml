name: core profiles

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  knowledge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[documents,modules,spatial]"
      - run: python -c "from pathlib import Path; Path('runs').mkdir(exist_ok=True)"
      - run: python -m pip check
      - run: python -c "import importlib.util; assert all(importlib.util.find_spec(n) is None for n in ['fluids','ifcopenshell','manifold3d'])"
      - run: python -m unittest tests.test_knowledge tests.test_knowledge_workflow tests.test_knowledge_ownership -v
  engineering-data:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[modules,spatial]"
      - run: python -c "from pathlib import Path; Path('runs').mkdir(exist_ok=True)"
      - run: python -m pip check
      - name: Verify the common-data profile without optional solvers
        run: python -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ['fluids','ifcopenshell','manifold3d'])"
      - run: python -m unittest tests.test_engineering_data tests.test_engineering_data_workflow tests.test_engineering_inputs tests.test_modular_electrical tests.test_changes tests.test_changes_workflow tests.test_parameter_changes tests.test_lighting_source -v
      - name: Add the existing full-HVAC fixture requirements for compatibility
        run: python -m pip install -e ".[network]"
      - run: python -m unittest tests.test_air_allocation_provider -v
      - name: Verify existing MCP workflow and artifact routes with common data
        run: |
          python -m pip install -e ".[mcp]"
          python -m unittest tests.test_engineering_data_mcp tests.test_changes_mcp -v
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[drawing,mcp,codex-setup]"
      - run: python -m bsa.codex_setup
      - run: bsa doctor --extra drawing --extra mcp --mcp-config .codex/config.toml
      - run: python -m pip check
      - name: Audit actual SDK tool and worker contract
        run: python scripts/check_mcp_contract.py --out runs/mcp-contract-audit.json
      - name: Verify offline Revit preparation and diagnosis
        run: >-
          python -m unittest
          tests.test_revit_automation_bundle tests.test_revit_connectivity
          tests.test_revit_revision tests.test_revit_workflow -v
      - name: Verify the RVT metadata report field allowlist
        run: python -m unittest tests.test_revit_file_metadata -v
      - name: Verify terminal connection evidence and HVAC report gating
        run: >-
          python -m unittest
          tests.test_air_terminal_drawing tests.test_hvac_connection_summary
          tests.test_hvac_package_paths -v
      - name: Verify saved OpenFOAM history review through CLI and MCP
        run: python -m unittest tests.test_openfoam_history tests.test_openfoam_transient tests.test_cfd_convergence -v
      - run: >-
          python -m unittest
          tests.test_engine tests.test_doctor tests.test_codex_setup
          tests.test_worker_transport tests.test_verification_scope tests.test_mcp_response_channel
          tests.test_mcp_startup tests.test_missing_dependency_errors
          tests.test_workspace_write_guards tests.test_project_workspace
          tests.test_review_cli tests.test_delivery_archive tests.test_recovery_imports tests.test_catalogue_iteration
          tests.test_runtime_logs tests.test_check_runner tests.test_reference_library -v
      - name: Reproduce committed source candidate
        run: |
          python scripts/build_candidate.py --out runs/source-candidate
          python scripts/build_candidate.py --out runs/source-candidate-repeated
          python -c "import json; from pathlib import Path; a=json.loads(Path('runs/source-candidate/receipt.json').read_text()); b=json.loads(Path('runs/source-candidate-repeated/receipt.json').read_text()); assert a['sha256']==b['sha256'], 'Source candidate is not reproducible'"
      - name: Retain source candidate for review
        if: matrix.os == 'ubuntu-latest' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: building-services-agent-source-candidate
          retention-days: 7
          if-no-files-found: error
          path: |
            runs/source-candidate/building-services-agent-source.zip
            runs/source-candidate/receipt.json

  hvac-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[reports,network,spatial]"
      - run: python -c "from pathlib import Path; Path('runs').mkdir(exist_ok=True)"
      - run: python -m pip check
      - run: python -c "import importlib.util; assert importlib.util.find_spec('matplotlib') is None; assert importlib.util.find_spec('ifcopenshell') is None; assert importlib.util.find_spec('manifold3d') is None"
      - run: python -m unittest tests.test_air_allocation tests.test_duct_schedule tests.test_terminal_throw tests.test_missing_dependency_errors -v

  pump-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[drawing,mcp,codex-setup,network]"
      - run: python -m bsa.codex_setup
      - run: python -c "import importlib.util; assert importlib.util.find_spec('ifcopenshell') is None; assert importlib.util.find_spec('manifold3d') is None"
      - run: python -m unittest tests.test_pump_recovery_example tests.test_mcp_pump_profile tests.test_recovery_imports -v

  mcp-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -e ".[drawing,mcp,codex-setup,bim,bcf,network,clash]"
      - run: python -m bsa.codex_setup --pdftoppm "$(command -v pdftoppm)"
      - run: pdftoppm -v
      - run: python -m pip check
      - run: python -m unittest tests.test_mcp_server tests.test_knowledge_mcp -v
      - name: Verify IFC connection review and BCF archive replay
        run: python -m unittest tests.test_ifc_port_inventory tests.test_ifc_port_bcf -v
